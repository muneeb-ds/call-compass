<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CallCompass</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="statusbar">
      <span class="statusbar-dot" id="health-dot" data-state="loading" aria-hidden="true"></span>
      <p class="statusbar-text mono" id="health-status" data-state="loading">
        Checking backend&hellip;
      </p>
      <p class="statusbar-position mono" id="position-readout" aria-live="polite"></p>
    </header>

    <main class="stage">
      <p class="message" id="tree-message" data-state="error" role="status" hidden></p>
      <div class="tree-graph grow" id="tree-slot">
        <svg id="tree-canvas" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
      </div>

      <div class="viewport-controls" id="viewport-controls">
        <button type="button" id="viewport-follow" class="viewport-control" disabled>Follow</button>
        <button type="button" id="viewport-fit" class="viewport-control">Fit</button>
      </div>

      <section class="dock" aria-label="Capture">
        <p class="message" id="capture-message" data-state="error" role="status" hidden></p>
        <div class="record-slot" id="record-slot">
          <button type="button" id="record-button" class="record" aria-pressed="false">
            Record
          </button>
        </div>
        <div class="pause-slot" id="pause-slot">
          <button type="button" id="pause-button" class="pause" aria-pressed="false" disabled>
            Pause
          </button>
        </div>
        <p class="timer mono" id="timer" role="timer">0:00 / 0:30</p>
        <div class="waveform" id="waveform-slot">
          <canvas id="waveform-canvas" aria-hidden="true"></canvas>
        </div>
        <div class="playback" id="playback-slot">
          <button type="button" id="play-button" class="play" aria-pressed="false" disabled>
            Play
          </button>
          <p class="playback-time mono" id="playback-time">0:00 / 0:00</p>
          <audio id="playback-audio" preload="auto"></audio>
        </div>
        <div class="reset-slot" id="reset-slot">
          <button type="button" id="reset-button" class="reset" disabled>Reset</button>
        </div>
        <p class="outcome" id="outcome-strip" aria-live="polite"></p>
      </section>

      <aside class="trace-rail" aria-label="Trace rail" id="trace-rail">
        <button
          type="button"
          id="trace-toggle"
          class="trace-toggle"
          aria-expanded="false"
          aria-controls="trace-panel"
        >
          Trace
        </button>
        <div class="trace-chips" id="trace-chip-list"></div>
        <p class="trace-chip-total mono" id="trace-chip-total">Total: &mdash;</p>
      </aside>

      <aside class="trace-panel" aria-label="Trace" id="trace-panel" data-state="collapsed">
        <p class="total mono" id="trace-total">Total: &mdash;</p>
        <div class="trace-list" id="trace-list" role="log" aria-live="polite"></div>
      </aside>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
